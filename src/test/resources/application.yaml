spring:
  application:
    name: finance-test

  datasource:
    url: jdbc:h2:mem:finance_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    open-in-view: false

jwt:
  secret: test_secret_key_for_unit_and_integration_tests_minimum_256_bits_long
